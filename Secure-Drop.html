<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Drop</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #000; color: #fff; margin: 0; padding: 0; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container { width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; }
        
        /* Login Screen */
        #login-screen { text-align: center; }
        input[type="password"] { 
            width: 90%; padding: 15px; margin: 10px 0; background: #111; 
            border: 1px solid #333; color: #fff; font-size: 16px; border-radius: 8px;
        }
        button { 
            width: 100%; padding: 15px; background: #007aff; color: white; 
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        button:active { opacity: 0.8; }
        
        /* Main App */
        #app-screen { display: none; }
        .upload-area { 
            border: 2px dashed #333; padding: 30px; text-align: center; 
            border-radius: 10px; margin-bottom: 20px; background: #0a0a0a;
        }
        input[type="file"] { margin-top: 10px; }
        
        .file-card { 
            background: #1a1a1a; padding: 15px; margin-bottom: 10px; 
            border-radius: 8px; display: flex; justify-content: space-between; align-items: center;
        }
        .dl-btn { 
            background: #28a745; padding: 8px 15px; text-decoration: none; 
            color: white; border-radius: 5px; font-size: 12px;
        }
        .copy-link { 
            background: #666; padding: 8px; border: none; color: white; 
            border-radius: 5px; margin-left: 5px;
        }
        #status { margin-top: 10px; font-size: 12px; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <!-- Login -->
    <div id="login-screen">
        <h2>🔒 Secure Vault</h2>
        <p style="color:#888;">Restricted Network Mode Active</p>
        <input type="password" id="passInput" placeholder="Enter Password">
        <button onclick="unlock()">ACCESS FILES</button>
        <p id="err" style="color:red; display:none; margin-top:10px;">Access Denied</p>
    </div>

    <!-- App -->
    <div id="app-screen">
        <h3>📂 My Files</h3>
        <div class="upload-area">
            <p>Select file from mobile</p>
            <input type="file" id="fileInput">
        </div>
        <button onclick="handleUpload()" id="upBtn">UPLOAD & GET LINK</button>
        <p id="status"></p>

        <hr style="border-color:#222; margin: 20px 0;">
        
        <h4>Download Links:</h4>
        <div id="fileList"></div>
    </div>
</div>

<script>
    const PASS = "admin123"; // Default Password
    
    function unlock() {
        if(document.getElementById('passInput').value === PASS) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
        } else {
            document.getElementById('err').style.display = 'block';
        }
    }

    function handleUpload() {
        const file = document.getElementById('fileInput').files[0];
        if(!file) return alert("Select a file first!");

        const reader = new FileReader();
        reader.onload = function(e) {
            const dataUrl = e.target.result;
            const fileName = file.name;
            
            // Create the download link logic
            const linkHtml = `
                <div class="file-card">
                    <span style="font-size:14px;">${fileName}</span>
                    <div>
                        <a href="${dataUrl}" download="${fileName}" class="dl-btn">⬇ Download</a>
                        <button class="copy-link" onclick="copyLink('${dataUrl}')">Copy</button>
                    </div>
                </div>
            `;
            
            // Prepend to list
            const list = document.getElementById('fileList');
            list.innerHTML = linkHtml + list.innerHTML;
            
            document.getElementById('status').innerText = "✅ Uploaded! Copy link and send it.";
            document.getElementById('fileInput').value = "";
        };
        reader.readAsDataURL(file);
    }

    function copyLink(url) {
        navigator.clipboard.writeText(url).then(() => {
            alert("Link Copied! Paste this in ANY browser.");
        });
    }
</script>

</body>
</html>
